<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIM Admin - Product Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 32px;
            font-weight: 600;
        }

        header p {
            opacity: 0.9;
            margin-top: 8px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e1e8ed;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #657786;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f3f7;
        }

        .card-header h2 {
            font-size: 22px;
            font-weight: 600;
            color: #2c3e50;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f3f7;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #e1e8ed;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            text-align: left;
            padding: 12px;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #e9ecef;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions button {
            padding: 6px 12px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 24px;
            font-weight: 600;
        }

        .close {
            font-size: 28px;
            cursor: pointer;
            color: #95a5a6;
            background: none;
            border: none;
            padding: 0;
            width: 32px;
            height: 32px;
        }

        .close:hover {
            color: #7f8c8d;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .attribute-row {
            display: grid;
            grid-template-columns: 2fr 1fr 2fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        }

        .attributes-container {
            margin-top: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #f0f3f7;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #95a5a6;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .success {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-primary {
            background: #e3e8ff;
            color: #667eea;
        }

        .badge-success {
            background: #d5f4e6;
            color: #2ecc71;
        }

        .attribute-display {
            display: inline-block;
            margin: 2px;
            padding: 4px 8px;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .hidden {
            display: none !important;
        }

        .detail-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-section {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
        }

        .detail-section h4 {
            margin-bottom: 12px;
            color: #667eea;
            font-weight: 600;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .detail-label {
            font-weight: 500;
            color: #6c757d;
        }

        .detail-value {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🏪 PIM Admin Dashboard</h1>
            <p>Product Information Management System</p>
        </div>
    </header>

    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('products')">Products</button>
            <button class="tab" onclick="showTab('swagger')">API Docs</button>
        </div>

        <!-- Products Tab -->
        <div id="products-tab">
            <div class="card">
                <div class="card-header">
                    <h2>Products</h2>
                    <button class="btn-primary" onclick="showProductModal()">+ Add Product</button>
                </div>

                <div id="products-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading products...</p>
                    </div>
                </div>
            </div>

            <!-- Selected Product Details -->
            <div id="product-detail-card" class="card hidden">
                <div class="card-header">
                    <h2>Product Details</h2>
                    <div class="actions">
                        <button class="btn-secondary btn-small" onclick="closeProductDetail()">Close</button>
                    </div>
                </div>
                <div id="product-detail-content"></div>

                <div class="card-header" style="margin-top: 30px;">
                    <h2>Variants</h2>
                    <button class="btn-primary btn-small" onclick="showVariantModal()">+ Add Variant</button>
                </div>
                <div id="variants-list"></div>
            </div>
        </div>

        <!-- Swagger Tab -->
        <div id="swagger-tab" class="hidden">
            <div class="card">
                <iframe src="/docs" style="width:100%; height:800px; border:none; border-radius:8px;"></iframe>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="product-modal-title">Add Product</h3>
                <button class="close" onclick="closeProductModal()">&times;</button>
            </div>

            <div id="product-modal-error" class="error hidden"></div>

            <form id="product-form" onsubmit="saveProduct(event)">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="product-name" required maxlength="500">
                </div>

                <div class="form-group">
                    <label>SKU *</label>
                    <input type="text" id="product-sku" required maxlength="100" pattern="[a-zA-Z0-9_-]+">
                    <small style="color: #6c757d;">Alphanumeric, hyphens, and underscores only</small>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="product-description" maxlength="10000"></textarea>
                </div>

                <div class="form-group">
                    <label>Attributes</label>
                    <div id="attributes-container" class="attributes-container"></div>
                    <button type="button" class="btn-secondary btn-small" onclick="addAttributeField()">+ Add Attribute</button>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeProductModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Variant Modal -->
    <div id="variant-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="variant-modal-title">Add Variant</h3>
                <button class="close" onclick="closeVariantModal()">&times;</button>
            </div>

            <div id="variant-modal-error" class="error hidden"></div>

            <form id="variant-form" onsubmit="saveVariant(event)">
                <div class="form-group">
                    <label>SKU *</label>
                    <input type="text" id="variant-sku" required maxlength="100" pattern="[a-zA-Z0-9_-]+">
                </div>

                <div class="form-group">
                    <label>Attributes</label>
                    <div id="variant-attributes-container" class="attributes-container"></div>
                    <button type="button" class="btn-secondary btn-small" onclick="addVariantAttributeField()">+ Add Attribute</button>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeVariantModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Variant</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State
        let products = [];
        let selectedProduct = null;
        let selectedProductVariants = [];
        let editingProduct = null;
        let editingVariant = null;
        const API_BASE = '/api/v1';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
        });

        // Tab Management
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('products-tab').classList.toggle('hidden', tabName !== 'products');
            document.getElementById('swagger-tab').classList.toggle('hidden', tabName !== 'swagger');
        }

        // API Calls
        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(API_BASE + endpoint, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Error');
                }

                if (response.status === 204) {
                    return null;
                }

                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // Load Products
        async function loadProducts() {
            try {
                const data = await apiCall('/products');
                products = data.products || [];
                renderProducts();
            } catch (error) {
                document.getElementById('products-list').innerHTML = `
                    <div class="error">Failed to load products: ${error.message}</div>
                `;
            }
        }

        // Render Products
        function renderProducts() {
            const container = document.getElementById('products-list');
            
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <h3>No products yet</h3>
                        <p>Click "Add Product" to create your first product</p>
                    </div>
                `;
                return;
            }

            const table = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>SKU</th>
                            <th>Attributes</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr>
                                <td><strong>${escapeHtml(p.name)}</strong></td>
                                <td><code>${escapeHtml(p.sku)}</code></td>
                                <td>${renderAttributeBadges(p.attributes)}</td>
                                <td>${new Date(p.created_at).toLocaleDateString()}</td>
                                <td>
                                    <div class="actions">
                                        <button class="btn-secondary btn-small" onclick="viewProduct('${p.id}')">View</button>
                                        <button class="btn-secondary btn-small" onclick="editProduct('${p.id}')">Edit</button>
                                        <button class="btn-danger btn-small" onclick="deleteProduct('${p.id}')">Delete</button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = table;
        }

        // Render Attribute Badges
        function renderAttributeBadges(attributes) {
            const attrs = typeof attributes === 'string' ? JSON.parse(attributes) : attributes;
            const keys = Object.keys(attrs);
            
            if (keys.length === 0) {
                return '<span style="color: #95a5a6;">No attributes</span>';
            }

            return keys.slice(0, 3).map(key => 
                `<span class="attribute-display">${key}</span>`
            ).join('') + (keys.length > 3 ? ` <span class="badge badge-primary">+${keys.length - 3} more</span>` : '');
        }

        // View Product Details
        async function viewProduct(id) {
            try {
                const product = await apiCall(`/products/${id}`);
                selectedProduct = product;
                
                // Load variants
                try {
                    const variantsData = await apiCall(`/products/${id}/variants`);
                    selectedProductVariants = variantsData.variants || [];
                } catch (e) {
                    selectedProductVariants = [];
                }

                renderProductDetail();
                document.getElementById('product-detail-card').classList.remove('hidden');
                
                // Scroll to detail
                document.getElementById('product-detail-card').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                alert('Failed to load product: ' + error.message);
            }
        }

        // Render Product Detail
        function renderProductDetail() {
            if (!selectedProduct) return;

            const attrs = typeof selectedProduct.attributes === 'string' 
                ? JSON.parse(selectedProduct.attributes) 
                : selectedProduct.attributes;

            const detailHTML = `
                <div class="detail-view">
                    <div class="detail-section">
                        <h4>Basic Information</h4>
                        <div class="detail-row">
                            <span class="detail-label">ID:</span>
                            <span class="detail-value"><code>${selectedProduct.id}</code></span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Name:</span>
                            <span class="detail-value">${escapeHtml(selectedProduct.name)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">SKU:</span>
                            <span class="detail-value"><code>${escapeHtml(selectedProduct.sku)}</code></span>
                        </div>
                        ${selectedProduct.description ? `
                        <div class="detail-row">
                            <span class="detail-label">Description:</span>
                            <span class="detail-value">${escapeHtml(selectedProduct.description)}</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="detail-section">
                        <h4>Attributes</h4>
                        ${Object.keys(attrs).length === 0 ? 
                            '<p style="color: #95a5a6;">No attributes</p>' :
                            Object.entries(attrs).map(([key, val]) => `
                                <div class="detail-row">
                                    <span class="detail-label">${escapeHtml(key)}:</span>
                                    <span class="detail-value">
                                        <span class="badge badge-${val.type === 'string' ? 'primary' : 'success'}">${val.type}</span>
                                        ${escapeHtml(String(val.value))}
                                    </span>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;

            document.getElementById('product-detail-content').innerHTML = detailHTML;
            renderVariants();
        }

        // Render Variants
        function renderVariants() {
            const container = document.getElementById('variants-list');
            
            if (selectedProductVariants.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎨</div>
                        <p>No variants yet. Click "Add Variant" to create one.</p>
                    </div>
                `;
                return;
            }

            const table = `
                <table>
                    <thead>
                        <tr>
                            <th>SKU</th>
                            <th>Attributes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${selectedProductVariants.map(v => `
                            <tr>
                                <td><code>${escapeHtml(v.sku)}</code></td>
                                <td>${renderAttributeBadges(v.attributes)}</td>
                                <td>
                                    <div class="actions">
                                        <button class="btn-secondary btn-small" onclick="editVariant('${v.id}')">Edit</button>
                                        <button class="btn-danger btn-small" onclick="deleteVariant('${v.id}')">Delete</button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = table;
        }

        // Show Product Modal
        function showProductModal(product = null) {
            editingProduct = product;
            document.getElementById('product-modal-title').textContent = product ? 'Edit Product' : 'Add Product';
            document.getElementById('product-modal-error').classList.add('hidden');

            if (product) {
                document.getElementById('product-name').value = product.name;
                document.getElementById('product-sku').value = product.sku;
                document.getElementById('product-sku').disabled = true; // SKU is immutable
                document.getElementById('product-description').value = product.description || '';
                
                const attrs = typeof product.attributes === 'string' ? JSON.parse(product.attributes) : product.attributes;
                document.getElementById('attributes-container').innerHTML = '';
                Object.entries(attrs).forEach(([key, val]) => {
                    addAttributeField(key, val.type, val.value);
                });
            } else {
                document.getElementById('product-form').reset();
                document.getElementById('product-sku').disabled = false;
                document.getElementById('attributes-container').innerHTML = '';
            }

            document.getElementById('product-modal').classList.add('active');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.remove('active');
            editingProduct = null;
        }

        // Add Attribute Field
        function addAttributeField(key = '', type = 'string', value = '') {
            const container = document.getElementById('attributes-container');
            const index = container.children.length;
            
            const row = document.createElement('div');
            row.className = 'attribute-row';
            row.innerHTML = `
                <input type="text" placeholder="Attribute name" value="${escapeHtml(key)}" id="attr-key-${index}">
                <select id="attr-type-${index}">
                    <option value="string" ${type === 'string' ? 'selected' : ''}>String</option>
                    <option value="number" ${type === 'number' ? 'selected' : ''}>Number</option>
                    <option value="boolean" ${type === 'boolean' ? 'selected' : ''}>Boolean</option>
                    <option value="date" ${type === 'date' ? 'selected' : ''}>Date</option>
                </select>
                <input type="text" placeholder="Value" value="${escapeHtml(String(value))}" id="attr-value-${index}">
                <button type="button" class="btn-danger btn-small" onclick="this.parentElement.remove()">Remove</button>
            `;
            
            container.appendChild(row);
        }

        // Save Product
        async function saveProduct(event) {
            event.preventDefault();
            
            const name = document.getElementById('product-name').value;
            const sku = document.getElementById('product-sku').value;
            const description = document.getElementById('product-description').value;
            
            // Collect attributes
            const attributes = {};
            const container = document.getElementById('attributes-container');
            Array.from(container.children).forEach((row, index) => {
                const key = document.getElementById(`attr-key-${index}`).value.trim();
                const type = document.getElementById(`attr-type-${index}`).value;
                let value = document.getElementById(`attr-value-${index}`).value;
                
                if (key) {
                    // Convert value based on type
                    if (type === 'number') {
                        value = parseFloat(value) || 0;
                    } else if (type === 'boolean') {
                        value = value === 'true' || value === '1';
                    }
                    
                    attributes[key] = { type, value };
                }
            });

            const payload = {
                name,
                sku,
                description: description || null,
                attributes
            };

            try {
                if (editingProduct) {
                    // Update
                    await apiCall(`/products/${editingProduct.id}`, {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });
                } else {
                    // Create
                    await apiCall('/products', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                }

                closeProductModal();
                await loadProducts();
                
                if (selectedProduct && editingProduct) {
                    await viewProduct(editingProduct.id);
                }
            } catch (error) {
                document.getElementById('product-modal-error').textContent = error.message;
                document.getElementById('product-modal-error').classList.remove('hidden');
            }
        }

        // Edit Product
        async function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (product) {
                showProductModal(product);
            }
        }

        // Delete Product
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product? All variants will also be deleted.')) {
                return;
            }

            try {
                await apiCall(`/products/${id}`, { method: 'DELETE' });
                await loadProducts();
                
                if (selectedProduct && selectedProduct.id === id) {
                    closeProductDetail();
                }
            } catch (error) {
                alert('Failed to delete product: ' + error.message);
            }
        }

        // Close Product Detail
        function closeProductDetail() {
            document.getElementById('product-detail-card').classList.add('hidden');
            selectedProduct = null;
            selectedProductVariants = [];
        }

        // Variant Modal
        function showVariantModal(variant = null) {
            if (!selectedProduct) return;

            editingVariant = variant;
            document.getElementById('variant-modal-title').textContent = variant ? 'Edit Variant' : 'Add Variant';
            document.getElementById('variant-modal-error').classList.add('hidden');

            if (variant) {
                document.getElementById('variant-sku').value = variant.sku;
                document.getElementById('variant-sku').disabled = true;
                
                const attrs = typeof variant.attributes === 'string' ? JSON.parse(variant.attributes) : variant.attributes;
                document.getElementById('variant-attributes-container').innerHTML = '';
                Object.entries(attrs).forEach(([key, val]) => {
                    addVariantAttributeField(key, val.type, val.value);
                });
            } else {
                document.getElementById('variant-form').reset();
                document.getElementById('variant-sku').disabled = false;
                document.getElementById('variant-attributes-container').innerHTML = '';
                // Add default fields
                addVariantAttributeField('size', 'string', '');
                addVariantAttributeField('price', 'number', '');
            }

            document.getElementById('variant-modal').classList.add('active');
        }

        function closeVariantModal() {
            document.getElementById('variant-modal').classList.remove('active');
            editingVariant = null;
        }

        // Add Variant Attribute Field
        function addVariantAttributeField(key = '', type = 'string', value = '') {
            const container = document.getElementById('variant-attributes-container');
            const index = container.children.length;
            
            const row = document.createElement('div');
            row.className = 'attribute-row';
            row.innerHTML = `
                <input type="text" placeholder="Attribute name" value="${escapeHtml(key)}" id="var-attr-key-${index}">
                <select id="var-attr-type-${index}">
                    <option value="string" ${type === 'string' ? 'selected' : ''}>String</option>
                    <option value="number" ${type === 'number' ? 'selected' : ''}>Number</option>
                    <option value="boolean" ${type === 'boolean' ? 'selected' : ''}>Boolean</option>
                    <option value="date" ${type === 'date' ? 'selected' : ''}>Date</option>
                </select>
                <input type="text" placeholder="Value" value="${escapeHtml(String(value))}" id="var-attr-value-${index}">
                <button type="button" class="btn-danger btn-small" onclick="this.parentElement.remove()">Remove</button>
            `;
            
            container.appendChild(row);
        }

        // Save Variant
        async function saveVariant(event) {
            event.preventDefault();
            
            const sku = document.getElementById('variant-sku').value;
            
            // Collect attributes
            const attributes = {};
            const container = document.getElementById('variant-attributes-container');
            Array.from(container.children).forEach((row, index) => {
                const key = document.getElementById(`var-attr-key-${index}`).value.trim();
                const type = document.getElementById(`var-attr-type-${index}`).value;
                let value = document.getElementById(`var-attr-value-${index}`).value;
                
                if (key) {
                    if (type === 'number') {
                        value = parseFloat(value) || 0;
                    } else if (type === 'boolean') {
                        value = value === 'true' || value === '1';
                    }
                    
                    attributes[key] = { type, value };
                }
            });

            const payload = { sku, attributes };

            try {
                if (editingVariant) {
                    // Update
                    await apiCall(`/variants/${editingVariant.id}`, {
                        method: 'PUT',
                        body: JSON.stringify({ attributes })
                    });
                } else {
                    // Create
                    await apiCall(`/products/${selectedProduct.id}/variants`, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                }

                closeVariantModal();
                await viewProduct(selectedProduct.id);
            } catch (error) {
                document.getElementById('variant-modal-error').textContent = error.message;
                document.getElementById('variant-modal-error').classList.remove('hidden');
            }
        }

        // Edit Variant
        async function editVariant(id) {
            const variant = selectedProductVariants.find(v => v.id === id);
            if (variant) {
                showVariantModal(variant);
            }
        }

        // Delete Variant
        async function deleteVariant(id) {
            if (!confirm('Are you sure you want to delete this variant?')) {
                return;
            }

            try {
                await apiCall(`/variants/${id}`, { method: 'DELETE' });
                await viewProduct(selectedProduct.id);
            } catch (error) {
                alert('Failed to delete variant: ' + error.message);
            }
        }

        // Utility Functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
